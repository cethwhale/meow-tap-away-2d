name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - run: chmod +x gradlew
      
      - run: ./gradlew assembleDebug
      
      - uses: actions/upload-artifact@v3
        with:
          name: my-apk
          path: app/build/outputs/apk/debug/app-debug.apk
